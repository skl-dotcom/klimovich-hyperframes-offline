<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HyperFrames render calibration</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827}
#calibration{position:relative;width:1920px;height:1080px;overflow:hidden;background:#101827}
#rail{position:absolute;left:240px;top:500px;width:1440px;height:80px;background:#24455F;border-radius:40px}
#marker{position:absolute;left:240px;top:460px;width:160px;height:160px;background:#F7C948;border-radius:20px}
</style>
<script src="gsap.min.js"></script>
</head>
<body>
<div id="calibration" data-composition-id="calibration" data-start="0" data-duration="3" data-width="1920" data-height="1080">
<div id="rail" data-layout-ignore></div>
<div id="marker" data-layout-ignore></div>
</div>
<script>
window.__timelines=window.__timelines||{};
const tl=gsap.timeline({paused:true});
tl.to("#marker",{x:1280,duration:2,ease:"none"},0.5);
window.__timelines.calibration=tl;
</script>
</body></html>
