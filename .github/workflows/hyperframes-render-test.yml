name: HyperFrames Render Test V1
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hyperframes-render-test-v1
  cancel-in-progress: true
jobs:
  render-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Render and verify technical composition
        run: bash scripts/test-hyperframes-render.sh "$RUNNER_TEMP/render-test"
      - name: Upload verified video and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: hyperframes-render-test-v1
          path: ${{ runner.temp }}/render-test/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
